name: 🚀 Release Pipeline — PR to master

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER
# Corre en todos los eventos de PR hacia master.
# Los pasos de release solo se ejecutan cuando el PR es mergeado.
# ─────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, closed]

# Cancela runs previos en el mismo PR si llega un nuevo push.
# Si el PR fue mergeado, no se cancela (es el run definitivo).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

# ─────────────────────────────────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # STEP 1 — Unit Tests
  # Corre en cada push al PR y al mergear. Rápido: sin Android SDK.
  # ───────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: 🧪 Step 1 — Unit Tests
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    timeout-minutes: 30

    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: write

    outputs:
      result: ${{ steps.run-tests.outcome }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: 📦 Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 🗑️ Delete stale cache
        if: steps.gradle-cache.outputs.cache-hit != 'true' && steps.gradle-cache.outputs.cache-matched-key != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "⚠️  Cache obsoleto detectado: ${{ steps.gradle-cache.outputs.cache-matched-key }}"
          echo "🗑️  Eliminando cache antiguo..."
          gh cache delete "${{ steps.gradle-cache.outputs.cache-matched-key }}" \
            --repo ${{ github.repository }} || true
          echo "✅ Cache antiguo eliminado"

      - name: 🔧 Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: 🧪 Run unit tests
        id: run-tests
        run: |
          ./gradlew test \
            --no-daemon \
            --warning-mode none \
            --console=plain \
            --stacktrace

      - name: 💾 Save Gradle cache
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: 📊 Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/**/*.xml
          check_name: 📋 Unit Test Results
          comment_title: 🧪 Unit Test Report
          comment_mode: always

      - name: 📄 Upload test report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-test-report-${{ github.run_number }}
          path: build/reports/tests/
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # STEP 2 — Functional Tests (Gradle TestKit)
  # Monta un proyecto Android real y corre bundleRelease de punta a punta.
  # Necesita Android SDK, por eso es un job aparte.
  # ───────────────────────────────────────────────────────────────────────────
  functional-tests:
    name: 🧩 Step 2 — Functional Tests (TestKit)
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    timeout-minutes: 45

    permissions:
      contents: read

    outputs:
      result: ${{ steps.run-tests.outcome }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: 📦 Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 🤖 Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          # El runner ya trae un SDK. Aceptamos licencias sin interacción: el paso de
          # setup-android que había antes se colgaba preguntando (y/N) en un job sin TTY.
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
              > /dev/null 2>&1 \
              || echo "⚠️  No se pudo instalar todo; se sigue con el SDK preinstalado"
          else
            echo "⚠️  No se encontró sdkmanager en ${ANDROID_HOME}; se sigue con el SDK preinstalado"
          fi

          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "sdk.dir=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: 🔧 Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: 🧩 Run functional tests
        id: run-tests
        run: |
          ./gradlew functionalTest \
            --no-daemon \
            --warning-mode none \
            --console=plain \
            --stacktrace

      - name: 💾 Save Gradle cache
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: 📊 Publish functional test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/functionalTest/**/*.xml
          check_name: 📋 Functional Test Results
          comment_title: 🧩 Functional Test Report
          comment_mode: always

      - name: 📄 Upload functional report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: functional-test-report-${{ github.run_number }}
          path: build/reports/tests/functionalTest/
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # STEP 3 — Check Tag Availability & Version Bump
  # Verifica dos condiciones:
  #   a) El tag v[newVersion] NO existe aún (no duplicado).
  #   b) newVersion > latestTag (la versión fue efectivamente incrementada).
  # ───────────────────────────────────────────────────────────────────────────
  check-tag:
    name: 🏷️ Step 3 — Check Tag & Version Bump
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    timeout-minutes: 10

    permissions:
      contents: read

    outputs:
      version:      ${{ steps.extract-version.outputs.version }}
      tag_name:     ${{ steps.extract-version.outputs.tag_name }}
      latest_tag:   ${{ steps.validate-version.outputs.latest_tag }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # historial completo para leer todos los tags

      - name: 📌 Extract version from gradle.properties
        id: extract-version
        run: |
          # Fuente de verdad: la clave `version` de gradle.properties.
          VERSION=$(grep -oP '^version\s*=\s*\K\S+' gradle.properties 2>/dev/null | head -1 || true)

          # Fallback por si algún día la versión vive en el build script.
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' build.gradle.kts 2>/dev/null | head -1 || true)
          fi

          if [ -z "$VERSION" ]; then
            echo "❌ No se encontró la versión en gradle.properties ni en build.gradle.kts"
            exit 1
          fi

          TAG_NAME="v${VERSION}"
          echo "version=${VERSION}"   >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "📌 Versión en Gradle: ${VERSION}  →  Tag a crear: ${TAG_NAME}"

      - name: "🔍 Validate: new tag > latest tag & no duplicate"
        id: validate-version
        run: |
          NEW_VERSION="${{ steps.extract-version.outputs.version }}"
          NEW_TAG="${{ steps.extract-version.outputs.tag_name }}"

          # ── Función de comparación semver (soporta MAJOR.MINOR.PATCH) ──────
          # Devuelve 0 si $1 > $2, 1 en caso contrario.
          semver_gt() {
            local A="${1#v}" B="${2#v}"
            local IFS=.
            read -ra VA <<< "$A"
            read -ra VB <<< "$B"
            for i in 0 1 2; do
              local a="${VA[$i]:-0}" b="${VB[$i]:-0}"
              if   (( 10#$a > 10#$b )); then return 0   # A > B
              elif (( 10#$a < 10#$b )); then return 1   # A < B
              fi
            done
            return 1   # A == B → no es estrictamente mayor
          }

          # ── Obtener el último tag semver del repo ────────────────────────
          LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "ℹ️  No hay tags previos en el repo. Primer release: ${NEW_TAG}"
            echo "latest_tag=ninguno" >> $GITHUB_OUTPUT
            echo "✅ Validación superada — primer release."
            exit 0
          fi

          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "🏷️  Último tag existente : ${LATEST_TAG}"
          echo "🆕 Nuevo tag a crear    : ${NEW_TAG}"

          # ── a) Verificar que el tag exacto no exista ─────────────────────
          if git ls-remote --tags origin "refs/tags/${NEW_TAG}" | grep -q "${NEW_TAG}"; then
            echo ""
            echo "❌ ERROR: El tag ${NEW_TAG} ya existe en el repositorio."
            echo "   Incrementa la versión en gradle.properties antes de mergear."
            exit 1
          fi

          # ── b) Verificar que newVersion > latestTag ───────────────────────
          if semver_gt "$NEW_VERSION" "$LATEST_TAG"; then
            echo ""
            echo "✅ Validación superada: ${NEW_TAG} > ${LATEST_TAG}"
          else
            echo ""
            echo "❌ ERROR: La versión ${NEW_VERSION} NO es mayor que el último tag ${LATEST_TAG}."
            echo "   Regla: el nuevo tag debe ser estrictamente mayor al último publicado."
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # STEP 4 — Build the plugin JAR + POM
  # Para un plugin de Gradle lo que se publica no es un AAR: es el JAR del plugin
  # y el POM de la publicación `pluginMaven` (la que JitPack sube a Maven).
  # ───────────────────────────────────────────────────────────────────────────
  build-release:
    name: 🏗️ Step 4 — Build Plugin JAR & POM
    runs-on: ubuntu-latest
    needs: [unit-tests, functional-tests, check-tag]
    if: github.event.pull_request.merged == true
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: 📦 Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 🔧 Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: 🏗️ Assemble plugin & generate publications
        run: |
          ./gradlew jar \
            generatePomFileForPluginMavenPublication \
            generatePomFileForAndroidBundleArtifactsPluginMarkerMavenPublication \
            --no-daemon \
            --warning-mode none \
            --console=plain \
            --stacktrace

      - name: 💾 Save Gradle cache
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: 🔎 Locate generated JAR
        id: find-jar
        run: |
          VERSION="${{ needs.check-tag.outputs.version }}"
          JAR_PATH="build/libs/android-bundle-artifacts-${VERSION}.jar"
          if [ ! -f "$JAR_PATH" ]; then
            echo "❌ No se encontró $JAR_PATH"
            ls -la build/libs/ || true
            exit 1
          fi
          echo "jar_path=${JAR_PATH}" >> $GITHUB_OUTPUT
          echo "✅ JAR encontrado: ${JAR_PATH}"

      - name: 📦 Upload JAR + POM as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-release
          path: |
            build/libs/*.jar
            build/publications/pluginMaven/*.pom
            build/publications/androidBundleArtifactsPluginMarkerMaven/*.pom
          retention-days: 7
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # STEP 5 — Create Tag & GitHub Release
  # El tag es lo que dispara el build de JitPack.
  # ───────────────────────────────────────────────────────────────────────────
  create-release:
    name: 🎯 Step 5 — Create Tag & GitHub Release
    runs-on: ubuntu-latest
    needs: [build-release, check-tag]
    if: github.event.pull_request.merged == true
    timeout-minutes: 10

    permissions:
      contents: write

    outputs:
      release_url: ${{ steps.gh-release.outputs.url }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: plugin-release
          path: ./release-artifacts

      - name: 🏷️ Create GitHub Release & Tag
        id: gh-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-tag.outputs.tag_name }}
          name: Release ${{ needs.check-tag.outputs.tag_name }}
          body: |
            ## 📦 android-bundle-artifacts ${{ needs.check-tag.outputs.tag_name }}

            Publicado automáticamente desde PR #${{ github.event.pull_request.number }}
            **${{ github.event.pull_request.title }}**

            Copia `mapping.txt` y `native-debug-symbols-<variant>.zip` junto al `.aab` y
            muestra los enlaces en la salida de Gradle. Sin configuración.

            ---

            ### 📥 Agregar el plugin via JitPack

            ```kotlin
            // settings.gradle.kts
            pluginManagement {
                repositories {
                    maven("https://jitpack.io")
                    gradlePluginPortal()
                    google()
                }
            }

            // build.gradle.kts (módulo android)
            plugins {
                id("com.android.application")
                id("com.github.LeandroLCD.android-bundle-artifacts") version "${{ needs.check-tag.outputs.tag_name }}"
            }
            ```

            Listo: no hay nada más que configurar.

            ---
            📅 Generado el: ${{ github.event.pull_request.merged_at }}
          files: ./release-artifacts/*.jar
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # STEP 6 — JitPack Build Log
  # Espera a que JitPack indexe el tag y muestra el build log.
  # ───────────────────────────────────────────────────────────────────────────
  jitpack-build:
    name: 📡 Step 6 — JitPack Build Log
    runs-on: ubuntu-latest
    needs: [create-release, check-tag]
    if: github.event.pull_request.merged == true
    timeout-minutes: 20

    outputs:
      jitpack_status: ${{ steps.poll-jitpack.outputs.jitpack_status }}
      jitpack_log_url: ${{ steps.poll-jitpack.outputs.jitpack_log_url }}

    steps:
      - name: ⏳ Initial wait — let JitPack index the new tag
        run: |
          echo "⏳ Esperando 40s para que JitPack indexe el tag ${{ needs.check-tag.outputs.tag_name }}..."
          sleep 40

      - name: 🚀 Trigger JitPack build & poll status
        id: poll-jitpack
        run: |
          VERSION="${{ needs.check-tag.outputs.version }}"
          GROUP="com.github.LeandroLCD"
          ARTIFACT="android-bundle-artifacts"
          LOG_URL="https://jitpack.io/${GROUP//.//}/${ARTIFACT}/${VERSION}/build.log"
          API_URL="https://jitpack.io/api/builds/${GROUP}/${ARTIFACT}/${VERSION}"

          echo "🔗 Log URL : ${LOG_URL}"
          echo "🔗 API URL : ${API_URL}"

          # Dispara la build solicitando el artefacto
          echo "🚀 Disparando build en JitPack..."
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            "https://jitpack.io/${GROUP//.//}/${ARTIFACT}/${VERSION}/${ARTIFACT}-${VERSION}.jar" || true

          # Polling: máximo 15 intentos × 30s = 7.5 min
          MAX=15
          ATTEMPT=0
          STATUS="unknown"

          while [ $ATTEMPT -lt $MAX ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "⏳ Intento ${ATTEMPT}/${MAX} — consultando estado en JitPack..."

            RESPONSE=$(curl -s --max-time 15 "${API_URL}" 2>/dev/null || echo '{}')
            STATUS=$(echo "$RESPONSE" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unknown")

            echo "   📊 Status: ${STATUS}"

            if [ "$STATUS" = "ok" ]; then
              echo "✅ JitPack build exitoso!"
              break
            elif [ "$STATUS" = "error" ]; then
              echo "❌ JitPack build falló. Revisa el log:"
              echo "   ${LOG_URL}"
              break
            fi

            [ $ATTEMPT -lt $MAX ] && sleep 30
          done

          echo "jitpack_status=${STATUS}"   >> $GITHUB_OUTPUT
          echo "jitpack_log_url=${LOG_URL}" >> $GITHUB_OUTPUT

      - name: 📄 Print JitPack build log
        if: always()
        run: |
          VERSION="${{ needs.check-tag.outputs.version }}"
          LOG_URL="https://jitpack.io/com/github/LeandroLCD/android-bundle-artifacts/${VERSION}/build.log"
          echo "════════════════════════════════════════"
          echo " JitPack Build Log — ${VERSION}"
          echo "════════════════════════════════════════"
          curl -s --max-time 30 "${LOG_URL}" || echo "⚠️  No se pudo obtener el log aún. URL: ${LOG_URL}"
          echo "════════════════════════════════════════"

  # ───────────────────────────────────────────────────────────────────────────
  # PR ANNOTATION — Resumen del pipeline como comentario en el PR
  # ───────────────────────────────────────────────────────────────────────────
  pr-summary:
    name: 📝 PR Summary Annotation
    runs-on: ubuntu-latest
    needs: [unit-tests, functional-tests, check-tag, build-release, create-release, jitpack-build]
    if: always() && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    timeout-minutes: 5

    permissions:
      pull-requests: write

    steps:
      - name: 📝 Post pipeline summary comment on PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const icon = (r) => ({
              success: '✅', failure: '❌', skipped: '⏭️', cancelled: '🚫'
            }[r] ?? '⚠️');

            const isMerged   = ${{ github.event.pull_request.merged == true }};
            const version    = `${{ needs.check-tag.outputs.version }}`;
            const tagName    = `${{ needs.check-tag.outputs.tag_name }}`;
            const latestTag  = `${{ needs.check-tag.outputs.latest_tag }}`;
            const releaseUrl = `${{ needs.create-release.outputs.release_url }}`;
            const jitpackStatus = `${{ needs.jitpack-build.outputs.jitpack_status }}`;
            const jitpackLog    = `${{ needs.jitpack-build.outputs.jitpack_log_url }}`;

            const r1 = `${{ needs.unit-tests.result }}`;
            const r2 = `${{ needs.functional-tests.result }}`;
            const r3 = `${{ needs.check-tag.result }}`;
            const r4 = `${{ needs.build-release.result }}`;
            const r5 = `${{ needs.create-release.result }}`;
            const r6 = `${{ needs.jitpack-build.result }}`;

            const mergeRow = isMerged
              ? '✅ **Mergeado** — pipeline completo ejecutado'
              : '⏳ **Pendiente de merge** — solo validaciones previas';

            const releaseLink = releaseUrl
              ? `[Ver GitHub Release](${releaseUrl})`
              : '—';

            const jitpackRow = jitpackLog
              ? `[📄 Build Log](${jitpackLog}) · Status: \`${jitpackStatus}\``
              : '—';

            const versionArrow = (latestTag && latestTag !== 'ninguno' && tagName)
              ? `\`${latestTag}\` → \`${tagName}\``
              : tagName ? `primer release: \`${tagName}\`` : 'N/A';

            const usageBlock = isMerged && version ? `
            ### 📥 Uso del plugin (JitPack)
            \`\`\`kotlin
            // settings.gradle.kts
            pluginManagement { repositories { maven("https://jitpack.io"); gradlePluginPortal(); google() } }

            // build.gradle.kts
            plugins { id("com.github.LeandroLCD.android-bundle-artifacts") version "${version}" }
            \`\`\`` : '';

            const warningBlock = (!isMerged && (r1 === 'failure' || r2 === 'failure' || r3 === 'failure'))
              ? `\n> ⚠️ **Hay errores de validación.** Corrígelos antes de mergear.\n`
              : '';

            const body = `## 🚀 Release Pipeline — Resumen

            ${warningBlock}
            | # | Paso | Estado | Detalle |
            |---|------|--------|---------|
            | 1️⃣ | Unit Tests | ${icon(r1)} \`${r1}\` | \`./gradlew test\` |
            | 2️⃣ | Functional Tests | ${icon(r2)} \`${r2}\` | \`./gradlew functionalTest\` · TestKit + AGP |
            | 3️⃣ | Check Tag & Bump | ${icon(r3)} \`${r3}\` | ${versionArrow} |
            | 4️⃣ | Build JAR & POM | ${icon(r4)} \`${r4}\` | \`jar\` + POM de \`pluginMaven\` |
            | 5️⃣ | GitHub Release | ${icon(r5)} \`${r5}\` | Tag \`${tagName || 'N/A'}\` + JAR · ${releaseLink} |
            | 6️⃣ | JitPack Build | ${icon(r6)} \`${r6}\` | ${jitpackRow} |

            **📌 Versión nueva:** \`${version || 'no detectada'}\` &nbsp;·&nbsp; **🏷️ Último tag:** \`${latestTag || '—'}\`
            **🔀 Estado:** ${mergeRow}
            ${usageBlock}

            ---
            <sub>🤖 Generado automáticamente por el Release Pipeline · Run #${{ github.run_number }}</sub>`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Release Pipeline — Resumen')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ─────────────────────────────────────────────────────────────────────────
  # DISCORD NOTIFICATION
  # ─────────────────────────────────────────────────────────────────────────
  notify-discord:
    name: 📣 Notify Discord
    runs-on: ubuntu-latest
    needs: [check-tag, build-release, create-release, jitpack-build]
    if: always() && github.event.pull_request.merged == true
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - name: 📣 Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          R1: ${{ needs.check-tag.result }}
          R2: ${{ needs.build-release.result }}
          R3: ${{ needs.create-release.result }}
          R4: ${{ needs.jitpack-build.result }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          AUTHOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LIBRARY_NAME: ${{ github.repository }}
          VERSION: ${{ needs.check-tag.outputs.version }}
          TAG: ${{ needs.check-tag.outputs.tag_name }}
          JITPACK_STATUS: ${{ needs.jitpack-build.outputs.jitpack_status }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if   [ "$R1" = "failure" ] || [ "$R2" = "failure" ] || [ "$R3" = "failure" ] || [ "$R4" = "failure" ]; then
            STATUS="failure"
          elif [ "$R1" = "cancelled" ] || [ "$R2" = "cancelled" ] || [ "$R3" = "cancelled" ] || [ "$R4" = "cancelled" ]; then
            STATUS="cancelled"
          elif [ "$R1" = "success" ] && [ "$R2" = "success" ] && [ "$R3" = "success" ] && [ "$R4" = "success" ]; then
            STATUS="success"
          else
            STATUS="skipped"
          fi

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "⚠️  DISCORD_WEBHOOK_URL no configurado — saltando notificación"
            {
              echo "## 📣 Discord notification skipped"
              echo "DISCORD_WEBHOOK_URL secret no configurado en este repo."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          case "$STATUS" in
            success)   EMOJI="✅"; COLOR=3066993 ;;
            failure)   EMOJI="❌"; COLOR=15158332 ;;
            cancelled) EMOJI="⚪"; COLOR=9807270 ;;
            *)         EMOJI="ℹ️"; COLOR=3447003 ;;
          esac

          SHORT_SHA="${SHA:0:7}"
          LIBRARY_NAME="${LIBRARY_NAME##*/}"
          VERSION_DISPLAY="${VERSION:-N/A}"
          TAG_DISPLAY="${TAG:-N/A}"

          if [ -n "$VERSION" ] && [ "$VERSION_DISPLAY" != "N/A" ]; then
            EMBED_TITLE="${EMOJI} ${LIBRARY_NAME} — new release ${VERSION_DISPLAY}"
          else
            EMBED_TITLE="${EMOJI} ${LIBRARY_NAME} — release pipeline"
          fi

          if [ -n "$TAG" ]; then
            TAG_URL="${RUN_URL%/*}/releases/tag/${TAG}"
            ARTIFACT_LINK="[${TAG}](${TAG_URL})"
          else
            ARTIFACT_LINK="—"
          fi
          JITPACK_DISPLAY="${JITPACK_STATUS:-skipped}"

          PR_FIELDS='[]'
          if [ -n "${PR_NUMBER:-}" ]; then
            PR_FIELDS=$(jq -nc \
              --arg title "${PR_TITLE:-}" \
              --arg num "$PR_NUMBER" \
              --arg url "${RUN_URL%/*}/pull/${PR_NUMBER}" \
              '[{name: "Pull Request", value: ("[PR #" + $num + ": " + $title + "](" + $url + ")"), inline: false}]')
          fi

          PAYLOAD=$(jq -nc \
            --arg username "GitHub Actions" \
            --arg avatar "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" \
            --arg title "$EMBED_TITLE" \
            --arg run_url "$RUN_URL" \
            --argjson color "$COLOR" \
            --arg status "$STATUS" \
            --arg short_sha "$SHORT_SHA" \
            --arg author "$AUTHOR" \
            --arg event "$EVENT" \
            --arg branch "$BRANCH" \
            --arg version "$VERSION_DISPLAY" \
            --arg tag "$TAG_DISPLAY" \
            --arg release_link "$ARTIFACT_LINK" \
            --arg jitpack "$JITPACK_DISPLAY" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson pr_fields "$PR_FIELDS" \
            '{
              username: $username,
              avatar_url: $avatar,
              embeds: [{
                title: $title,
                url: $run_url,
                color: $color,
                fields: (
                  [
                    {name: "Estado",  value: $status,         inline: true},
                    {name: "Branch",  value: $branch,         inline: true},
                    {name: "Commit",  value: ("`" + $short_sha + "`"), inline: true},
                    {name: "Autor",   value: $author,         inline: true},
                    {name: "Evento",  value: $event,          inline: true},
                    {name: "Versión", value: $version,        inline: true},
                    {name: "Tag",     value: $tag,            inline: true},
                    {name: "Artifact", value: $release_link,   inline: false},
                    {name: "JitPack", value: $jitpack,        inline: true}
                  ] + $pr_fields
                ),
                timestamp: $ts
              }]
            }')

          HTTP_CODE=$(curl --fail -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" "$DISCORD_WEBHOOK_URL" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" -ge 400 ] 2>/dev/null; then
            echo "⚠️ Discord notification FAILED (HTTP $HTTP_CODE)."
            {
              echo "## 📣 Discord notification FAILED"
              echo "- HTTP code: \`$HTTP_CODE\`"
              echo "- Pipeline status: \`$STATUS\`"
              echo "- [Abrir run](${RUN_URL})"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "📣 Notificación enviada a Discord (HTTP $HTTP_CODE) — pipeline: ${STATUS}"