[versions]
kotlin = "2.4.20"
# Mínima versión de AGP soportada. El plugin compila contra esta API pública, que es
# idéntica en toda la major 9.x.
agp = "9.0.1"
junitBom = "6.1.3"
# Versión del plugin que consume el módulo `:sample`. Tiene que coincidir con la clave
# `version` de gradle.properties, que es la que publica el release pipeline.
bundleArtifacts = "0.1.1"
agpVersion = "9.4.0"
junit4 = "4.13.2"
appcompat = "1.7.1"
androidxTestRunner = "1.6.2"
espressoCore = "3.6.1"
androidxTestJunit = "1.2.1"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junitBom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agpVersion" }